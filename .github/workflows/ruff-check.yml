name: Python lint

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test-support:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Lint test support
        run: >-
          ruff check
          tests/test_webshare.py
          tests/test_resolver_cassettes.py
          tests/test_message_regressions.py
          tests/resolver_cassette.py
          tests/live_mediafire.py
