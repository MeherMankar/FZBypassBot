name: Python formatting

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-test-support-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Check test support formatting
        run: >-
          ruff format --check
          tests/test_webshare.py
          tests/test_resolver_cassettes.py
          tests/resolver_cassette.py
          tests/live_mediafire.py
